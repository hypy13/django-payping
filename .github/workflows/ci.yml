name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
        exclude:
          - {python: '3.10', django: '6.0'}
          - {python: '3.10', django: '6.1'}
          - {python: '3.11', django: '6.0'}
          - {python: '3.11', django: '6.1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'Django~=${{ matrix.django }}.0'
      - run: python -m django test tests --settings=tests.settings
      - run: python -m django makemigrations --check --dry-run --settings=tests.settings

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check distribution contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          private = {'REVIEW.md', 'woo-payping-gateway', 'resources', '.env', '.git', '.venv', '__pycache__'}
          for archive in pathlib.Path('dist').iterdir():
              if archive.suffix == '.whl':
                  with zipfile.ZipFile(archive) as package:
                      names = package.namelist()
              else:
                  with tarfile.open(archive) as package:
                      names = package.getnames()
              for name in names:
                  parts = pathlib.PurePosixPath(name).parts
                  if private.intersection(parts) or any(part.startswith('docs-payping-ir.') for part in parts):
                      raise SystemExit(f'Private resource in distribution: {name}')
              for required in ('django_payping/py.typed', 'django_payping/migrations/0001_initial.py',
                               'django_payping/migrations/0002_payment_recovery_and_events.py',
                               'django_payping/migrations/0003_model_metadata.py',
                               'django_payping/locale/fa/LC_MESSAGES/django.mo',
                               'django_payping/management/commands/payping_recover.py'):
                  if not any(name.endswith('/' + required) or name == required for name in names):
                      raise SystemExit(f'Missing package file: {required}')
              print(f'{archive.name}: contents checked')
          PY
      - run: python -m pip install dist/*.whl
      - run: python -m django test tests --settings=tests.settings
      - run: python -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m mypy
      - run: python -m ruff check src tests
      - run: python -m ruff format --check src tests
